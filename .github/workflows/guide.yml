name: Guide des programmes

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          path: epg

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer l'outil
        working-directory: epg
        run: npm ci

      - name: Récupérer les programmes
        working-directory: epg
        run: npm run grab --- --channels=../custom.channels.xml --output=../guide.xml --gzip=../guide.xml.gz --days=3 --maxConnections=5

      - name: Publier le guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.xml.gz
          git diff --cached --quiet || git commit -m "Guide des programmes du $(date -u +%F)"
          git push
